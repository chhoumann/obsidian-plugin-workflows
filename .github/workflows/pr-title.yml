name: PR Title

# Reusable Conventional-Commit PR title validation for Obsidian plugin repos.
#
# Releases are driven by semantic-release from the squash-merge commit, which is
# the PR title. Validating it as a Conventional Commit means a bad title can't
# produce a wrong (or missing) release.
#
# The caller MUST trigger on `pull_request_target` (not `pull_request`): it runs
# the base branch's workflow definition, so a PR cannot edit away its own title
# check. This workflow never checks out or runs PR head code and only reads the
# PR, so pull_request_target is safe here. See
# templates/caller-workflows/pr-title.yml.

on:
    workflow_call:
        inputs:
            types:
                description: |
                    Newline-separated Conventional Commit types to allow.
                    Defaults to the standard set used across the plugin repos.
                type: string
                required: false
                default: |
                    feat
                    fix
                    perf
                    docs
                    style
                    refactor
                    test
                    build
                    ci
                    chore
                    revert
                    release

permissions:
    pull-requests: read

concurrency:
    group: pr-title-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    validate:
        name: Validate PR title
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: audit
            - name: Lint PR title
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPOSITORY: ${{ github.repository }}
                  TYPES: ${{ inputs.types }}
              run: |
                  # A rerun replays the original event payload, so read the live title.
                  PR_TITLE="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .title)"
                  # The conventionalcommits preset's header grammar: type(scope)!: subject.
                  types="$(printf '%s\n' "$TYPES" | tr ',' '\n' | tr -d '[:blank:]' | sed '/^$/d' | paste -sd '|')"
                  pattern="^(${types})(\(.*\))?!?: .+$"
                  if [[ ! "$PR_TITLE" =~ $pattern ]]; then
                      echo "::error title=Invalid PR title::The PR title is not a Conventional Commit header (<type>[(scope)][!]: <subject>). Allowed types: ${types//|/, }"
                      exit 1
                  fi
                  echo "PR title is a valid Conventional Commit header."
