name: Self test

# CI for this repo's own PRs. The reusable ci.yml is workflow_call-only and
# serves consumers; without this file the release-pipeline scripts have no
# gate on their own changes.

on:
    push:
        branches: [main]
    pull_request:

permissions: {}

concurrency:
    group: self-test-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Test
              run: npm test

            # The release workflows install the toolkit from inside the caller's
            # checkout. A caller's pnpm pin, pnpm-workspace.yaml or .npmrc must not
            # change that install, or it can silently install the caller's
            # packages instead.
            - name: Toolkit install ignores the caller's pnpm config
              shell: bash
              run: |
                  CALLER="$RUNNER_TEMP/caller"
                  mkdir -p "$CALLER"
                  git archive --prefix=.release-toolkit/ HEAD | tar -x -C "$CALLER"
                  cd "$CALLER"
                  echo '{"name":"caller","private":true,"packageManager":"pnpm@12.14.0"}' > package.json
                  printf 'nodeLinker: hoisted\nminimumReleaseAge: 999999999\n' > pnpm-workspace.yaml
                  echo 'node-linker=hoisted' > .npmrc

                  pnpm --dir .release-toolkit install --frozen-lockfile --ignore-scripts | tee "$RUNNER_TEMP/toolkit-install.log"

                  TOOLKIT_PNPM="$(node -p "require('./.release-toolkit/package.json').packageManager.split('@')[1]")"
                  grep -q "using pnpm v$TOOLKIT_PNPM" "$RUNNER_TEMP/toolkit-install.log"
                  test -f .release-toolkit/node_modules/@semantic-release/commit-analyzer/package.json
                  test ! -e .release-toolkit/node_modules/handlebars

    lint-workflows:
        name: Lint workflows
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # actionlint 1.7.12 predates the job.workflow_* contexts the release
            # workflows read, so it reports them as undefined.
            - name: actionlint
              run: |
                  docker run --rm -v "$PWD:/repo:ro" -w /repo \
                    rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
                    -color \
                    -ignore 'property "workflow_(file_path|repository|sha)" is not defined' \
                    .github/workflows/*.yml templates/caller-workflows/*.yml

            - name: zizmor
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo \
                    ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 \
                    --persona=regular \
                    .github templates/dependabot.yml templates/caller-workflows/*.yml
