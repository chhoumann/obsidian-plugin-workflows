name: PR Title

# Caller stub for the reusable PR-title workflow. Copy to
# .github/workflows/pr-title.yml.
#
# MUST be pull_request_target: it runs the base branch's workflow definition, so
# a PR cannot edit away its own title check. The reusable workflow never checks
# out PR head code, so this is safe. The validated title becomes the
# squash-merge commit, which drives the semantic-release version.
on:
    pull_request_target: # zizmor: ignore[dangerous-triggers] reads only the title; no checkout
        types: [opened, edited, synchronize, reopened]

permissions:
    pull-requests: read

jobs:
    pr-title:
        uses: chhoumann/obsidian-plugin-workflows/.github/workflows/pr-title.yml@149e37801b35c120660a1fd5e78a5471fda55726 # v4.1.0
        permissions:
            pull-requests: read
        # with:
        #     types: |
        #         feat
        #         fix
        #         ...
