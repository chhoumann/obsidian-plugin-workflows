name: PR Title

# Caller stub for the reusable PR-title workflow. Copy to
# .github/workflows/pr-title.yml.
#
# MUST be pull_request_target: it runs the base branch's workflow definition, so
# a PR cannot edit away its own title check. The reusable workflow never checks
# out PR head code and needs no token permissions, so this is safe. The validated
# title becomes the squash-merge commit, which drives the semantic-release
# version.
on:
    pull_request_target:
        types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
    pr-title:
        uses: chhoumann/obsidian-plugin-workflows/.github/workflows/pr-title.yml@v1
        permissions: {}
        # with:
        #     types: |
        #         feat
        #         fix
        #         ...
